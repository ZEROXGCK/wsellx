<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wselx Shop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f4f6fa;
    --card: #ffffff;
    --ink: #0f172a;
    --sub: #64748b;
    --line: #e2e8f0;
    --brand: #2563eb;
    --brand-hover: #1d4ed8;
    --brand-soft: #eff6ff;
    --ok: #16a34a;
    --ok-soft: #dcfce7;
    --bad: #dc2626;
    --bad-soft: #fee2e2;
    --warn: #d97706;
    --warn-soft: #fef3c7;
    --radius: 14px;
    --shadow: 0 2px 10px rgba(15, 23, 42, 0.04);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font: 15px/1.6 'Noto Sans Thai', system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--ink);
  }

  img { max-width: 100%; display: block; }
  button, input, textarea, select { font: inherit; color: inherit; }

  /* Topbar */
  .bar {
    position: sticky;
    top: 0;
    z-index: 30;
    background: rgba(255, 255, 255, 0.92);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--line);
  }

  .bar > div, main, footer {
    max-width: 1120px;
    margin: 0 auto;
    padding: 0 18px;
  }

  .bar > div {
    min-height: 64px;
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    padding-top: 8px;
    padding-bottom: 8px;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    font-weight: 800;
    font-size: 18px;
    cursor: pointer;
    margin-right: auto;
    color: var(--ink);
  }

  .brand img {
    width: 34px;
    height: 34px;
    border-radius: 10px;
    object-fit: cover;
    border: 1px solid var(--line);
  }

  .brand .logo-fallback {
    width: 34px;
    height: 34px;
    border-radius: 10px;
    background: linear-gradient(135deg, #2563eb, #0ea5e9);
    color: #fff;
    display: grid;
    place-items: center;
    font-size: 16px;
    font-weight: 800;
  }

  nav { display: flex; gap: 4px; flex-wrap: wrap; }

  nav button {
    background: none;
    border: 0;
    padding: 8px 13px;
    border-radius: 10px;
    color: var(--sub);
    font-weight: 600;
    cursor: pointer;
    transition: 0.15s;
  }

  nav button:hover { background: #f1f5f9; color: var(--ink); }
  nav button[aria-current="page"] { background: var(--brand-soft); color: var(--brand); }

  .pill {
    padding: 6px 13px;
    border: 1px solid #bfdbfe;
    border-radius: 999px;
    background: var(--brand-soft);
    color: var(--brand);
    font-weight: 700;
    font-size: 13.5px;
    cursor: pointer;
  }

  .btn {
    padding: 10px 18px;
    border-radius: 10px;
    border: 0;
    background: var(--brand);
    color: #fff;
    font-weight: 600;
    cursor: pointer;
    transition: 0.15s;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }

  .btn:hover:not(:disabled) { background: var(--brand-hover); }
  .btn:disabled { opacity: 0.45; cursor: not-allowed; }
  .btn.ghost { background: #fff; color: var(--ink); border: 1px solid var(--line); }
  .btn.ghost:hover:not(:disabled) { background: #f8fafc; border-color: #cbd5e1; }
  .btn.sm { padding: 6px 12px; font-size: 13px; border-radius: 8px; }
  .btn.danger { background: var(--bad); }
  .btn.danger:hover:not(:disabled) { background: #b91c1c; }
  .btn.ok { background: var(--ok); }
  .btn.ok:hover:not(:disabled) { background: #15803d; }

  main { padding-top: 24px; padding-bottom: 64px; }

  /* Hero */
  .hero {
    display: grid;
    grid-template-columns: 1.15fr 0.85fr;
    gap: 24px;
    align-items: center;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 28px;
    margin-bottom: 24px;
    box-shadow: var(--shadow);
  }

  .hero h1 { font-size: clamp(22px, 3vw, 31px); line-height: 1.28; margin: 0 0 10px; letter-spacing: -0.01em; }
  .hero p { color: var(--sub); margin: 0 0 18px; font-size: 15px; }
  .hero img { width: 100%; aspect-ratio: 16/9; object-fit: cover; border-radius: 14px; border: 1px solid var(--line); }

  .stats { display: flex; flex-wrap: wrap; gap: 22px; margin-top: 20px; padding-top: 18px; border-top: 1px solid var(--line); }
  .stats b { display: block; font-size: 18px; color: var(--ink); }
  .stats span { color: var(--sub); font-size: 12.5px; }

  .promo { margin-bottom: 24px; border-radius: 16px; overflow: hidden; border: 1px solid var(--line); box-shadow: var(--shadow); }
  .promo img { width: 100%; max-height: 220px; object-fit: cover; }

  /* Filters & Grid */
  .filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 18px; }
  .seg { display: inline-flex; flex-wrap: wrap; background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 4px; gap: 3px; }
  .seg button { border: 0; background: none; padding: 7px 14px; border-radius: 8px; color: var(--sub); font-weight: 600; cursor: pointer; font-size: 13.5px; }
  .seg button[aria-pressed="true"] { background: var(--brand); color: #fff; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 18px; }

  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    box-shadow: var(--shadow);
  }

  .card > img { width: 100%; aspect-ratio: 16/9; object-fit: cover; border-bottom: 1px solid var(--line); }
  .card .b { padding: 18px; display: flex; flex-direction: column; flex: 1; }

  .tags { display: flex; gap: 6px; margin-bottom: 8px; flex-wrap: wrap; align-items: center; }
  .tag { font-size: 11.5px; font-weight: 700; padding: 3px 9px; border-radius: 6px; background: #f1f5f9; color: #334155; }
  .tag.AIS { background: #dcfce7; color: #166534; }
  .tag.TRUE { background: #fee2e2; color: #991b1b; }
  .tag.dtac { background: #e0f2fe; color: #075985; }
  .tag.promo { background: var(--warn-soft); color: #92400e; }
  .tag.srv { background: #ede9fe; color: #5b21b6; }
  .tag.ok { background: var(--ok-soft); color: #166534; }
  .tag.bad { background: var(--bad-soft); color: #991b1b; }

  .card h3 { margin: 0 0 6px; font-size: 17px; }
  .card p { margin: 0 0 14px; color: var(--sub); font-size: 13.5px; }
  .card .foot { margin-top: auto; display: flex; align-items: center; justify-content: space-between; padding-top: 14px; border-top: 1px solid var(--line); }
  .price { font-size: 20px; font-weight: 800; color: var(--brand); }
  .price small { font-size: 12.5px; font-weight: 500; color: var(--sub); }

  /* Admin Layout */
  .admin-wrap {
    display: grid;
    grid-template-columns: 230px 1fr;
    gap: 20px;
    align-items: start;
  }

  .admin-nav {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 10px;
    display: flex;
    flex-direction: column;
    gap: 4px;
    box-shadow: var(--shadow);
    position: sticky;
    top: 80px;
  }

  .admin-nav .nav-group {
    font-size: 11px;
    font-weight: 700;
    color: var(--sub);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    padding: 10px 10px 4px;
  }

  .admin-nav button {
    width: 100%;
    text-align: left;
    background: none;
    border: 0;
    padding: 9px 12px;
    border-radius: 10px;
    font-weight: 600;
    font-size: 13.5px;
    color: var(--ink);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .admin-nav button:hover { background: #f1f5f9; }
  .admin-nav button[aria-pressed="true"] { background: var(--brand); color: #fff; }
  .admin-nav button .cnt {
    font-size: 11.5px;
    padding: 1px 7px;
    border-radius: 999px;
    background: var(--bad);
    color: #fff;
  }

  .section-card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 22px;
    margin-bottom: 18px;
    box-shadow: var(--shadow);
  }

  .section-card h3 {
    margin: 0 0 14px;
    font-size: 16.5px;
    padding-bottom: 10px;
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .kpi-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
    gap: 12px;
    margin-bottom: 18px;
  }

  .kpi {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 14px 16px;
    box-shadow: var(--shadow);
  }

  .kpi span { display: block; font-size: 12.5px; color: var(--sub); }
  .kpi b { font-size: 21px; color: var(--ink); }

  /* Forms & Tables */
  label { display: block; font-size: 13px; font-weight: 600; margin: 12px 0 5px; color: #334155; }
  input, textarea, select {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: #fff;
    transition: border-color 0.15s;
  }
  input:focus, textarea:focus, select:focus { outline: 0; border-color: var(--brand); box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12); }

  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .row3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px; }

  .panel { max-width: 580px; margin: 0 auto; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 24px; box-shadow: var(--shadow); }
  .panel h2 { margin: 0 0 14px; }

  .msg { padding: 12px 15px; border-radius: 10px; margin: 12px 0; font-size: 14px; font-weight: 500; }
  .msg.ok { background: var(--ok-soft); color: #166534; border: 1px solid #bbf7d0; }
  .msg.bad { background: var(--bad-soft); color: #991b1b; border: 1px solid #fecaca; }

  .table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; background: #fff; }
  table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  th { background: #f8fafc; font-weight: 700; color: #475569; text-align: left; padding: 11px 13px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  td { padding: 11px 13px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  tr:last-child td { border-bottom: 0; }
  tr:hover td { background: #fafcff; }

  .acct {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 12.5px;
    background: #f8fafc;
    border: 1px dashed #cbd5e1;
    border-radius: 10px;
    padding: 11px;
    white-space: pre-wrap;
    word-break: break-all;
    margin-top: 8px;
  }

  dialog { border: 0; border-radius: 18px; padding: 0; max-width: 500px; width: calc(100% - 28px); box-shadow: 0 24px 60px rgba(15, 23, 42, 0.25); }
  dialog::backdrop { background: rgba(15, 23, 42, 0.5); backdrop-filter: blur(2px); }
  .dlg { padding: 24px; }
  .dlg h3 { margin: 0 0 12px; font-size: 18px; }
  .plans { display: grid; gap: 8px; margin: 12px 0; }
  .plans label { margin: 0; display: flex; align-items: center; gap: 10px; padding: 11px 14px; border: 1px solid var(--line); border-radius: 12px; cursor: pointer; }
  .plans input { width: auto; }
  .plans label:has(input:checked) { border-color: var(--brand); background: var(--brand-soft); }

  .stars { color: #f59e0b; letter-spacing: 1px; }
  .review-item { padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 13.5px; }
  .review-item:last-child { border-bottom: 0; }

  .empty { text-align: center; padding: 40px 20px; color: var(--sub); }
  .hint { font-size: 12.5px; color: var(--sub); margin-top: 4px; }
  .img-prev { width: 120px; height: 70px; object-fit: cover; border-radius: 10px; border: 1px solid var(--line); margin-top: 8px; }

  footer {
    border-top: 1px solid var(--line);
    padding-top: 22px;
    padding-bottom: 32px;
    color: var(--sub);
    font-size: 13.5px;
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    justify-content: space-between;
  }

  @media (max-width: 820px) {
    .hero { grid-template-columns: 1fr; }
    .admin-wrap { grid-template-columns: 1fr; }
    .admin-nav { position: static; flex-direction: row; flex-wrap: wrap; }
    .admin-nav .nav-group { display: none; }
    .admin-nav button { width: auto; }
    .row2, .row3 { grid-template-columns: 1fr; }
  }
</style>
<link rel="stylesheet" href="theme.css">
</head>
<body>
<header class="bar"><div id="bar"></div></header>
<main id="app"></main>
<footer id="foot"></footer>
<dialog id="dlg"><div class="dlg" id="dlgBody"></div></dialog>
<script src="app.js"></script>
</body>
</html>
